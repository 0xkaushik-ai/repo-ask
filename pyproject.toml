[project]
name = "repo-ask"
version = "0.1.0"
description = "Ask questions about any codebase from the command line. A small, read-only AI agent."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kauhsik Raj", email = "algorithmunloack@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["ai", "agent", "cli", "codebase", "claude", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "anthropic>=1.15.0",
    "rich>=15.0.0",
]

[project.scripts]
repo-ask = "repo_ask.cli:main"

[project.urls]
Homepage = "https://github.com/0xkaushik-ai/repo-ask"
Repository = "https://github.com/0xkaushik-ai/repo-ask"
Issues = "https://github.com/0xkaushik-ai/repo-ask/issues"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["repo_ask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
